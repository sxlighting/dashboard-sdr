<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDR Performance Pro - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & VARS --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0e27;
            --bg-card: #1a1f3a;
            --accent-cyan: #00d9ff;
            --accent-green: #06ffa5;
            --text-primary: #ffffff;
            --text-secondary: #8b92b0;
            --border-color: #2a3150;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(0, 217, 255, 0.1), transparent 70%);
            pointer-events: none; z-index: -1;
        }

        /* --- LOGIN --- */
        .login-container {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; position: fixed; top: 0; left: 0; width: 100%;
            background: var(--bg-primary); z-index: 999;
        }
        .login-box {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 40px; width: 100%; max-width: 400px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-secondary); }
        .form-input {
            width: 100%; padding: 12px; background: #0f1225; border: 1px solid var(--border-color);
            border-radius: 8px; color: white;
        }
        .btn-primary {
            width: 100%; padding: 14px; background: var(--accent-cyan); border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; margin-top: 10px;
        }

        /* --- DASHBOARD --- */
        .dashboard { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .dashboard.active { display: block; }
        
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 30px;
        }

        /* --- FILTROS --- */
        .filter-bar {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px;
            background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color);
            align-items: flex-end;
        }
        .filter-item { display: flex; flex-direction: column; gap: 5px; }
        .filter-item label { font-size: 12px; color: var(--text-secondary); }
        .date-input {
            padding: 8px; background: var(--bg-primary); border: 1px solid var(--border-color);
            color: white; border-radius: 6px; font-family: 'Lexend', sans-serif;
        }

        /* --- GRID --- */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;
        }
        .card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px;
        }
        .kpi-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        .kpi-value { font-size: 28px; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin: 10px 0; }
        .kpi-sub { font-size: 12px; color: var(--text-secondary); }

        /* --- CHART FIX --- */
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .chart-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px;
        }
        /* AQUI ESTÁ A CORREÇÃO DO SCROLL */
        .chart-wrapper {
            position: relative;
            height: 300px; /* Altura fixa impede crescimento infinito */
            width: 100%;
        }

        /* --- TABELA --- */
        .table-responsive { overflow-x: auto; background: var(--bg-card); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; font-size: 12px; color: var(--text-secondary); padding: 10px; border-bottom: 1px solid var(--border-color); }
        td { padding: 15px 10px; font-size: 14px; border-bottom: 1px solid #2a3150; }
        tr:last-child td { border-bottom: none; }

        @media (max-width: 768px) {
            .charts-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="login-container" id="loginScreen">
        <div class="login-box">
            <h2 style="margin-bottom: 20px; text-align: center;">Acesso SDR</h2>
            <div id="errorMsg" style="color: #ff6b35; text-align: center; display: none; margin-bottom: 15px; font-size: 13px;">Senha incorreta</div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Seu Nome</label>
                    <select id="userSelect" class="form-input" required>
                        <option value="">Selecione...</option>
                        <option value="Nathalia Lima">Nathalia Lima</option>
                        <option value="Beatriz Santos">Beatriz Santos</option>
                        <option value="Larissa Portella">Larissa Portella</option>
                        <option value="Felipe Mitterbach">Felipe Mitterbach</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="passInput" class="form-input" required>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </div>
    </div>

    <div class="dashboard" id="dashScreen">
        <div class="header">
            <div>
                <h1>Performance</h1>
                <p style="color: var(--text-secondary); font-size: 14px;" id="currentDate">...</p>
            </div>
            <button onclick="location.reload()" style="background:none; border:1px solid #333; color:#fff; padding:8px 15px; border-radius:6px; cursor:pointer;">Sair</button>
        </div>

        <div class="filter-bar">
            <div class="filter-item">
                <label>Início</label>
                <input type="date" id="dateStart" class="date-input">
            </div>
            <div class="filter-item">
                <label>Fim</label>
                <input type="date" id="dateEnd" class="date-input">
            </div>
            <button onclick="applyFilters()" class="btn-primary" style="width: auto; margin: 0; padding: 8px 20px;">Filtrar</button>
        </div>

        <div id="loading" style="text-align: center; padding: 40px; display: none;">
            <p>Carregando dados...</p>
        </div>

        <div id="content" style="display: none;">
            <div class="stats-grid">
                <div class="card">
                    <div class="kpi-label">Ligações Totais</div>
                    <div class="kpi-value" id="valCalls">0</div>
                    <div class="kpi-sub" id="valEffective">0 > 45s</div>
                </div>
                <div class="card">
                    <div class="kpi-label">Em Qualificação</div>
                    <div class="kpi-value" id="valSuspect" style="color: #ffd60a;">0</div>
                    <div class="kpi-sub">Suspect</div>
                </div>
                <div class="card">
                    <div class="kpi-label">Qualificados</div>
                    <div class="kpi-value" id="valQualified" style="color: #06ffa5;">0</div>
                    <div class="kpi-sub">Prontos p/ Venda</div>
                </div>
                <div class="card">
                    <div class="kpi-label">Pipeline Gerado</div>
                    <div class="kpi-value" id="valMoney" style="color: #06ffa5;">R$ 0,00</div>
                    <div class="kpi-sub" id="valOppCount">0 Oportunidades</div>
                </div>
            </div>

            <div class="charts-row">
                <div class="chart-card">
                    <h3 style="font-size: 16px; margin-bottom: 15px;">Funil de Conversão</h3>
                    <div class="chart-wrapper">
                        <canvas id="funnelChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h3 style="font-size: 16px; margin-bottom: 15px;">Atividade Diária</h3>
                    <div class="chart-wrapper">
                        <canvas id="callsChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <h3 style="font-size: 16px; margin-bottom: 15px;">Últimas Oportunidades</h3>
                <table id="oppTable">
                    <thead>
                        <tr>
                            <th>Cliente / Oportunidade</th>
                            <th>Fase</th>
                            <th>Valor</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const CONFIG = {
            users: { 'Nathalia Lima': 'sdr2025', 'Beatriz Santos': 'sdr2025', 'Larissa Portella': 'sdr2025', 'Felipe Mitterbach': 'sdr2025' },
            emailMap: { 'nathalia': 'Nathalia Lima', 'beatriz': 'Beatriz Santos', 'larissa': 'Larissa Portella', 'felipe': 'Felipe Mitterbach' },
            nectarId: '17g2rGIZUzRRNh4_ez2VooykpVt8yIQjIcL3He_hoOOw',
            callsId: '1Hmcq0ihu1bpwwM-MuUzAYULiilH82qj7xFyI-VnyNAo'
        };

        let state = {
            user: null,
            raw: { leadboard: [], opps: [], calls: [] },
            charts: { funnel: null, calls: null }
        };

        // --- INICIALIZAÇÃO ---
        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
            document.getElementById('dateStart').valueAsDate = firstDay;
            document.getElementById('dateEnd').valueAsDate = now;
            document.getElementById('currentDate').textContent = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('userSelect').value;
            const p = document.getElementById('passInput').value;
            if (CONFIG.users[u] === p) {
                state.user = u;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashScreen').classList.add('active');
                loadData();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });

        // --- CARREGAMENTO DE DADOS ---
        async function loadData() {
            document.getElementById('loading').style.display = 'block';
            try {
                const [leadboard, opps, calls] = await Promise.all([
                    fetchSheet(CONFIG.nectarId, 'Leadboard'),
                    fetchSheet(CONFIG.nectarId, 'Oportunidades'),
                    fetchSheet(CONFIG.callsId, 'Ligacoes')
                ]);

                // Filtro inicial por usuário
                state.raw.leadboard = leadboard.filter(r => r['Leadboard: Responsável'] === state.user);
                
                state.raw.opps = opps.filter(r => {
                    const res = r['Corresponsáveis: Usuários'] || '';
                    return res.includes(state.user);
                });

                state.raw.calls = calls.filter(r => {
                    const email = (r['usuario_email'] || '').toLowerCase();
                    for(let k in CONFIG.emailMap) {
                        if(email.includes(k) && CONFIG.emailMap[k] === state.user) return true;
                    }
                    return false;
                });

                applyFilters();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (e) {
                alert('Erro ao carregar dados. Verifique a conexão.');
                console.error(e);
            }
        }

        async function fetchSheet(id, sheet) {
            const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheet)}`;
            const r = await fetch(url);
            const t = await r.text();
            const json = JSON.parse(t.substring(47).slice(0, -2));
            const cols = json.table.cols.map(c => c.label || c.id);
            return json.table.rows.map(row => {
                let obj = {};
                row.c.forEach((cell, i) => obj[cols[i]] = cell ? cell.v : null);
                return obj;
            });
        }

        // --- PARSING & FILTROS ---
        
        // Função Especial para limpar Valor Monetário
        function parseCurrency(val) {
            if (!val) return 0;
            if (typeof val === 'number') return val;
            
            // Ex: "R$ 1.200,50" -> "1200.50"
            // 1. Remove tudo que não é número, ponto ou vírgula
            let clean = val.toString().replace(/[^\d.,]/g, '');
            
            // 2. Se tiver vírgula, substitui ponto de milhar por vazio e vírgula por ponto
            if (clean.includes(',')) {
                clean = clean.replace(/\./g, '').replace(',', '.');
            }
            
            const num = parseFloat(clean);
            return isNaN(num) ? 0 : num;
        }

        window.applyFilters = function() {
            const dStart = new Date(document.getElementById('dateStart').value);
            const dEnd = new Date(document.getElementById('dateEnd').value);
            dEnd.setHours(23, 59, 59);

            // Filtrar Oportunidades por Data
            const filteredOpps = state.raw.opps.filter(o => {
                const dDate = new Date(o['Data de criação'] || o['Data'] || o['Criado em']); // Ajuste o nome da coluna se precisar
                return !isNaN(dDate) && dDate >= dStart && dDate <= dEnd;
            });

            // Filtrar Ligações por Data
            const filteredCalls = state.raw.calls.filter(c => {
                let dDate;
                if(c['data']) { // Formato GViz
                   if(typeof c['data'] === 'string' && c['data'].includes('Date')) 
                       dDate = new Date(eval("new " + c['data']));
                   else dDate = new Date(c['data']);
                }
                return !isNaN(dDate) && dDate >= dStart && dDate <= dEnd;
            });

            // Leadboard é snapshot (geralmente não tem data de criação fácil), mantemos o filtro de data APENAS para opps e calls
            // Se quiser filtrar leadboard, precisaria de uma coluna "Data Entrada"
            const filteredLeadboard = state.raw.leadboard; 

            updateUI(filteredLeadboard, filteredOpps, filteredCalls);
        };

        function updateUI(leadboard, opps, calls) {
            // 1. Calls KPI
            const totalCalls = calls.length;
            const effectiveCalls = calls.filter(c => (c['duracao_segundos'] || 0) > 45).length;
            
            // 2. Pipeline KPI (Correção do Bug de Qualificados)
            let countSuspect = 0;
            let countQualified = 0;

            leadboard.forEach(l => {
                // Normaliza string para lowercase e remove espaços
                const stage = (l['Leadboard: Etapa'] || '').toLowerCase().trim();
                
                // Lógica mais flexível
                if(stage.includes('suspect')) countSuspect++;
                if(stage.includes('qualificad') || stage.includes('ganha')) countQualified++; 
            });

            // 3. Financeiro KPI (Correção do Bug de Valor)
            let totalValue = 0;
            opps.forEach(o => {
                // Tenta achar a coluna de valor em várias possibilidades
                const valRaw = o['Valor'] || o['Receita'] || o['Valor Estimado'] || o['Budget'];
                totalValue += parseCurrency(valRaw);
            });

            // DOM Updates
            document.getElementById('valCalls').textContent = totalCalls;
            document.getElementById('valEffective').textContent = `${effectiveCalls} > 45s`;
            document.getElementById('valSuspect').textContent = countSuspect;
            document.getElementById('valQualified').textContent = countQualified;
            document.getElementById('valMoney').textContent = totalValue.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('valOppCount').textContent = `${opps.length} opps`;

            // Tabelas e Gráficos
            renderTable(opps);
            renderCharts(countSuspect, countQualified, calls);
        }

        function renderTable(opps) {
            const tbody = document.querySelector('#oppTable tbody');
            tbody.innerHTML = '';
            opps.slice(0, 8).forEach(o => {
                const tr = document.createElement('tr');
                const val = parseCurrency(o['Valor'] || o['Valor Estimado']);
                const dateRaw = o['Data de criação'] || o['Data'];
                let dateStr = '-';
                
                if (dateRaw) {
                    const d = new Date(dateRaw);
                    if (!isNaN(d)) dateStr = d.toLocaleDateString('pt-BR');
                }

                tr.innerHTML = `
                    <td style="font-weight:600">${o['Oportunidade'] || o['Nome'] || 'Cliente'}</td>
                    <td><span style="background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:4px; font-size:12px;">${o['Fase'] || '-'}</span></td>
                    <td style="font-family:'JetBrains Mono'">${val.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
                    <td style="color:#8b92b0; font-size:12px;">${dateStr}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderCharts(suspect, qualified, calls) {
            // Config comum
            Chart.defaults.color = '#8b92b0';
            Chart.defaults.borderColor = '#2a3150';

            // Funil
            if(state.charts.funnel) state.charts.funnel.destroy();
            state.charts.funnel = new Chart(document.getElementById('funnelChart'), {
                type: 'bar',
                data: {
                    labels: ['Suspect', 'Qualificado'],
                    datasets: [{
                        label: 'Leads',
                        data: [suspect, qualified],
                        backgroundColor: ['#ffd60a', '#06ffa5'],
                        barThickness: 40
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false, // IMPORTANTE PARA O CSS CONTROLAR A ALTURA
                    plugins: { legend: { display: false } }
                }
            });

            // Linha do tempo
            const callsByDate = {};
            calls.forEach(c => {
                let dKey = 'N/D';
                if(c['data']) {
                     // Lógica para extrair data do GViz string ou objeto Date
                     const raw = c['data'];
                     const d = (typeof raw === 'string' && raw.includes('Date')) ? new Date(eval("new " + raw)) : new Date(raw);
                     if(!isNaN(d)) dKey = d.toLocaleDateString('pt-BR');
                }
                callsByDate[dKey] = (callsByDate[dKey] || 0) + 1;
            });

            // Ordenar datas
            const labels = Object.keys(callsByDate).sort((a,b) => {
                const [da, ma, ya] = a.split('/').map(Number);
                const [db, mb, yb] = b.split('/').map(Number);
                return new Date(ya, ma-1, da) - new Date(yb, mb-1, db);
            });

            if(state.charts.calls) state.charts.calls.destroy();
            state.charts.calls = new Chart(document.getElementById('callsChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Ligações',
                        data: labels.map(l => callsByDate[l]),
                        borderColor: '#00d9ff',
                        backgroundColor: 'rgba(0, 217, 255, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // IMPORTANTE
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
    </script>
</body>
</html>
